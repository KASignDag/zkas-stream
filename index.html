    <title>ZKAS Stream</title>
    <script>
      if (window.location.hash === '#community-mining' || window.location.hash === '#/community-mining') {
        window.location.replace('/community-mining.html'+window.location.search);
      }
      document.addEventListener('click', function (event) {
        const target = event.target instanceof Element ? event.target.closest('a[href="#community-mining"], a[href="#/community-mining"]') : null;
        if (!target) return;
        event.preventDefault();
        window.location.href = '/community-mining.html'+window.location.search;
      });

    </script>
