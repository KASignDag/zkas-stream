<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07130f" />
    <meta name="description" content="ZKAS Stream — public merged-mining attribution, mining-share intelligence and network health for ZKas." />
    <title>ZKAS Stream</title>
    <script>
      if (window.location.hash === '#community-mining' || window.location.hash === '#/community-mining') {
        window.location.replace('/community-mining.html');
      }
      document.addEventListener('click', function (event) {
        const target = event.target instanceof Element ? event.target.closest('a[href="#community-mining"], a[href="#/community-mining"]') : null;
        if (!target) return;
        event.preventDefault();
        window.location.href = '/community-mining.html';
      });

      // Keep the Genesis Supporters page code intact, but hide its navigation
      // entry for now so it does not take space in the main site UI.
      function hideSupportersNav() {
        document.querySelectorAll('.nav button').forEach(function (button) {
          if (button.textContent && button.textContent.trim() === 'Supporters') {
            button.style.display = 'none';
          }
        });
      }
      document.addEventListener('DOMContentLoaded', function () {
        hideSupportersNav();
        new MutationObserver(hideSupportersNav).observe(document.body, { childList: true, subtree: true });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
