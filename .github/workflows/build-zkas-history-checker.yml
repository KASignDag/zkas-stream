name: Build ZKAS history checker

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-zkas-history-checker.yml

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out official ZKAS source
        uses: actions/checkout@v4
        with:
          repository: firecash/zkas-rusty
          ref: zkas-v1.0.8
          path: zkas-rusty

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protocol Buffers compiler
        shell: pwsh
        run: |
          choco install protoc --no-progress -y
          $protoc = (Get-Command protoc.exe).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $protoc --version

      - name: Build read-only history checker
        working-directory: zkas-rusty
        run: cargo build --locked --release --package zkas-api --bin zkas-history-status

      - name: Create verified download package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-package" -Force | Out-Null
          Copy-Item "zkas-rusty/target/release/zkas-history-status.exe" "release-package/zkas-history-status.exe"
          Get-FileHash "release-package/zkas-history-status.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  zkas-history-status.exe" } |
            Set-Content -Encoding ascii "release-package/zkas-history-status.sha256"
          Compress-Archive -Path "release-package/*" -DestinationPath "zkas-history-status-windows-x64.zip" -Force

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: zkas-history-status-windows-x64
          path: zkas-history-status-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

