name: Publish verified ZKAS mining indexer

on:
  push:
    paths:
      - .github/workflows/publish-zkas-mining-indexer.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Download verified build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/KASignDag/zkas-stream/actions/artifacts/10304981535/zip" -OutFile "artifact.zip"
          Expand-Archive -Path "artifact.zip" -DestinationPath "artifact" -Force
          Get-FileHash "artifact/zkas-mining-indexer-windows-x64.zip" -Algorithm SHA256

      - name: Publish permanent release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "zkas-mining-indexer-v1.0.8" --repo "KASignDag/zkas-stream" --target "cf6c5792a0a8595df6d90c009b363f1d31c2ba92" --title "ZKAS Mining Payout Indexer for Windows x64" --notes "Read-only network-wide ZKAS mining payout indexer built against official ZKAS v1.0.8. Requires a local node whose shielded history is complete from genesis. EXE SHA256: 9540391017771a23d5e3b4dc7cd2272dc2627386d9493fb2e626ab8fabaca010" "artifact/zkas-mining-indexer-windows-x64.zip"
