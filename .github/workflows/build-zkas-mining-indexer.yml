name: Build ZKAS mining payout indexer

on:
  workflow_dispatch:
  push:
    paths:
      - tools/zkas-mining-indexer.rs
      - .github/workflows/build-zkas-mining-indexer.yml

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out ranking tool
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out official ZKAS v1.0.8 source
        uses: actions/checkout@v4
        with:
          repository: firecash/zkas-rusty
          ref: zkas-v1.0.8
          path: zkas-rusty

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protocol Buffers compiler
        shell: pwsh
        run: |
          choco install protoc --no-progress -y
          $protoc = (Get-Command protoc.exe).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $protoc --version

      - name: Add indexer to official workspace
        shell: pwsh
        run: |
          Copy-Item "site/tools/zkas-mining-indexer.rs" "zkas-rusty/zkas-api/src/bin/zkas-mining-indexer.rs"

      - name: Build read-only indexer
        working-directory: zkas-rusty
        run: cargo build --locked --release --package zkas-api --bin zkas-mining-indexer

      - name: Create verified package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-package" -Force | Out-Null
          Copy-Item "zkas-rusty/target/release/zkas-mining-indexer.exe" "release-package/zkas-mining-indexer.exe"
          Get-FileHash "release-package/zkas-mining-indexer.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  zkas-mining-indexer.exe" } |
            Set-Content -Encoding ascii "release-package/zkas-mining-indexer.sha256"
          Compress-Archive -Path "release-package/*" -DestinationPath "zkas-mining-indexer-windows-x64.zip" -Force

      - name: Upload Windows indexer
        uses: actions/upload-artifact@v4
        with:
          name: zkas-mining-indexer-windows-x64
          path: zkas-mining-indexer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

